# Stack de tests de integración — parte del proyecto `versus`.
#
# Comparte espacio de nombres con docker-compose.yml + docker-compose.dev.yml
# (mismo `name: versus`), por lo que reutiliza por nombre:
#   - la red `app-network`
#   - el volumen `maven_cache` del entorno de desarrollo (sin re-descarga
#     de dependencias si ya levantaste el devcontainer alguna vez)
#
# Servicios bajo el perfil `test` para que un `up` sin perfil sea no-op.
#
# Uso 1) Suite completa dentro de contenedores (idéntico a CI):
#   docker compose -f docker-compose.test.yml --profile test \
#     up --build --abort-on-container-exit \
#     --exit-code-from backend-test backend-test
#
# Uso 2) Solo Postgres en contenedor, tests desde IDE/host:
#   docker compose -f docker-compose.test.yml --profile test up -d db-test
#   cd backend && ./mvnw verify -Dsurefire.skip=true
#
# `application-it.properties` apunta a localhost:5433 (uso 2). Dentro de
# `backend-test` (uso 1) las env vars SPRING_DATASOURCE_* sobrescriben para
# apuntar a `db-test:5432`.

name: versus

services:

  db-test:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: versus_test
      POSTGRES_USER: versus_test
      POSTGRES_PASSWORD: versus_test_pass
    ports:
      - "5433:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U versus_test -d versus_test"]
      interval: 3s
      timeout: 2s
      retries: 20

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-test:5432/versus_test
      SPRING_DATASOURCE_USERNAME: versus_test
      SPRING_DATASOURCE_PASSWORD: versus_test_pass
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    working_dir: /app
    networks:
      - app-network
    # `verify` invoca compile + test-compile + (surefire saltado) + failsafe.
    # Llamar a failsafe:integration-test directamente NO compila y rompe el
    # discovery con NoClassDefFoundError.
    # Hacemos chmod y ejecutamos mvnw en un solo comando de shell.
    command: >
      sh -c "chmod +x /app/mvnw && ./mvnw verify -Dsurefire.skip=true --batch-mode -Dstyle.color=never"

networks:
  app-network:
    driver: bridge

volumes:
  maven_cache:
